name: orders_daily
schedule: hour
tasks:
  - name: extract
    script: extract.py
    retries: 1
    sla_seconds: 10
  - name: transform
    script: transform.py
    depends_on: [extract]
    retries: 1
  - name: load
    script: load.py
    depends_on: [transform]
  - name: check
    script: check.py
    depends_on: [load]
    sla_seconds: 5
